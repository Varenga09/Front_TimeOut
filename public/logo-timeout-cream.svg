<svg xmlns="http://www.w3.org/2000/svg" width="1104" height="310" viewBox="0 0 552 155" role="img" aria-labelledby="title desc">
  <title id="title">Time Out</title>
  <desc id="desc">Logo Time Out em creme com cronômetro entre as palavras</desc>
  <defs>
    <radialGradient id="stopwatchGlow" cx="50%" cy="48%" r="58%">
      <stop offset="0%" stop-color="#f2dab7" stop-opacity="0.28"/>
      <stop offset="58%" stop-color="#f2dab7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f2dab7" stop-opacity="0"/>
    </radialGradient>
    <filter id="wordShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <filter id="watchShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ebd3b0" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g fill="#f2dab7" filter="url(#wordShadow)" font-family="Arial Black, Arial, sans-serif" font-size="128" font-weight="900">
    <text x="8" y="121">TIME</text>
    <text x="392" y="121">UT</text>
  </g>
  <g color="#f2dab7" transform="translate(263 7)" filter="url(#watchShadow)">
    <circle cx="58" cy="76" r="52" fill="url(#stopwatchGlow)"/>
    <circle cx="58" cy="76" r="49" stroke="currentColor" stroke-width="7" fill="none"/>
    <circle cx="58" cy="76" r="38" stroke="currentColor" stroke-width="4" fill="none" opacity="0.95"/>
    <rect x="41" y="5" width="34" height="13" rx="4" fill="none" stroke="currentColor" stroke-width="6"/>
    <line x1="58" y1="18" x2="58" y2="29" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
    <path d="M95 27l11 11" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
    <circle cx="58" cy="76" r="5.8" fill="currentColor"/>
    <line x1="58" y1="76" x2="89" y2="45" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
    <line x1="58" y1="32" x2="58" y2="41" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="58" y1="111" x2="58" y2="121" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
  </g>
